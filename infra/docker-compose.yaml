---
services:
  nginx:
    image: nginx:1.31.7
    container_name: nginx
    restart: always
    env_file: ".env.nginx"
    ports:
    - "443:443"
    depends_on:
      gerrit:
        condition: service_healthy
    volumes:
    - ./.logs/nginx:/var/log/nginx/analysis
    - ./nginx/nginx.conf.template:/etc/nginx/conf.d/default.conf.template:ro
    - outputs:/var/www/outputs:ro
    - ${NGINX_CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    - ${NGINX_STATIC_DIR:-/var/www/ci.spdk.io}:/var/www/localhost:ro
    networks:
    - gerrit
    command:
    - /bin/bash
    - -c
    - |
      envsubst '$${NGINX_SSL_DOMAIN_NAME}' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf
      exec nginx -g 'daemon off;'

  nginx-log-exporter:
    image: ghcr.io/jkroepke/access-log-exporter:0.5.2
    container_name: nginx-log-exporter
    restart: always
    command: ["--preset", "simple"]
    depends_on:
    - nginx
    networks:
    - gerrit

  gerrit:
    image: gerritcodereview/gerrit:3.14.5
    container_name: gerrit
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "-X", "GET", "${GERRIT_URL}/config/server/version"]
      start_period: 60s
      start_interval: 3s
      timeout: 5s
      interval: 15s
      retries: 5
    volumes:
    - ${GERRIT_DIR}/cache:/var/gerrit/cache
    - ${GERRIT_DIR}/data:/var/gerrit/data
    - ${GERRIT_DIR}/db:/var/gerrit/db
    - ${GERRIT_DIR}/etc:/var/gerrit/etc
    - ${GERRIT_DIR}/events-db:/var/gerrit/events-db
    - ${GERRIT_DIR}/git:/var/gerrit/git
    - ${GERRIT_DIR}/index:/var/gerrit/index
    - ${GERRIT_DIR}/lib:/var/gerrit/lib
    - ${GERRIT_DIR}/logs:/var/gerrit/logs
    - ${GERRIT_DIR}/plugins:/var/gerrit/plugins
    - ${GERRIT_DIR}/static:/var/gerrit/static
    - ${GERRIT_DIR}/tmp:/var/gerrit/tmp
    - ${GERRIT_DIR}/.ssh:/var/gerrit/.ssh
    env_file: ".env"
    environment:
    - CANONICAL_WEB_URL=${GERRIT_URL}
    ports:
    - "29418:29418"
    - "8080:8080"
    networks:
    - gerrit

  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: prometheus
    restart: always
    ports:
    - "127.0.0.1:9090:9090"
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./prometheus/gerrit_token:/run/secrets/gerrit_token:ro
    - prometheus-data:/prometheus
    command:
    - "--config.file=/etc/prometheus/prometheus.yml"
    - "--storage.tsdb.path=/prometheus"
    - "--web.console.libraries=/usr/share/prometheus/console_libraries"
    - "--web.console.templates=/usr/share/prometheus/consoles"
    - "--web.listen-address=0.0.0.0:9090"
    - "--web.enable-lifecycle"
    depends_on:
    - gerrit
    - nginx-log-exporter
    networks:
    - gerrit

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: always
    ports:
    - "127.0.0.1:3000:3000"
    env_file: ".env.grafana"
    volumes:
    - grafana-data:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning
    - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    depends_on:
    - prometheus
    networks:
    - gerrit

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    restart: always
    command:
    - -config.file=/etc/loki/config.yml
    volumes:
    - ./loki/config.yml:/etc/loki/config.yml:ro
    - loki-data:/loki
    depends_on:
    - grafana
    networks:
    - gerrit

  alloy:
    image: grafana/alloy:v1.15.0
    container_name: alloy
    restart: always
    command:
    - run
    - --storage.path=/var/lib/alloy
    - /etc/alloy/config.alloy
    volumes:
    - alloy-data:/var/lib/alloy
    - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    - ./.logs/nginx:/var/log/nginx:ro
    - ./geoip:/etc/alloy/geoip:ro
    depends_on:
    - grafana
    networks:
    - gerrit

  forwarder:
    image: forwarder:latest
    build:
      context: ./forwarder
      dockerfile: Dockerfile
    container_name: forwarder
    restart: always
    env_file:
    - .env
    - .env.forwarder
    depends_on:
      gerrit:
        condition: service_healthy
      nginx:
        condition: service_started
    volumes:
    - logs:/var/log
    - outputs:/output
    networks:
    - gerrit

  mergable_changes:
    image: mergable_changes:latest
    build:
      context: ./mergable_changes
      dockerfile: Dockerfile
    container_name: mergable_changes
    restart: always
    env_file: ".env"
    depends_on:
      gerrit:
        condition: service_healthy
      nginx:
        condition: service_started
    volumes:
    - logs:/var/log
    - outputs:/output
    networks:
    - gerrit

volumes:
  logs:
  outputs:
  loki-data:
  alloy-data:
  grafana-data:
  prometheus-data:

networks:
  gerrit:
    driver: bridge
