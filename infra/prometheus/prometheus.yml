---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
- job_name: 'prometheus'
  static_configs:
  - targets: ['prometheus:9090']

- job_name: 'gerrit'
  static_configs:
  - targets: ['gerrit:8080']
  metrics_path: '/plugins/metrics-reporter-prometheus/metrics'
  scrape_interval: 10s
  authorization:
    type: Bearer
    credentials_file: /run/secrets/gerrit_token

